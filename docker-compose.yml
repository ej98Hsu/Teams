version: '3.8'

services:
  # 我們的 Java 後端服務（目前先用 Dockerfile 建立映像檔）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teams_backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    command: mvn spring-boot:run